<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>香港公眾健康技術研究中心 | HKPHTRC</title>
  <meta name="description" content="香港公眾健康技術研究中心（HKPHTRC）— 致力推動粵港澳大灣區公共衛生科學研究、技術創新與循證決策。" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #000000;
      --near-black: #111111;
      --dark: #1a1a1a;
      --charcoal: #2c2c2c;
      --gray-dark: #444444;
      --gray: #666666;
      --gray-mid: #888888;
      --gray-light: #aaaaaa;
      --gray-lighter: #cccccc;
      --border: #e0e0e0;
      --off-white: #f5f5f5;
      --warm-white: #faf9f7;
      --white: #ffffff;
      --accent: #8B0000;
      --accent-light: #a52a2a;
      --gold: #c5a55a;
      --serif-en: 'Playfair Display', 'Georgia', 'Times New Roman', serif;
      --serif-cn: 'Noto Serif TC', '宋体', 'SimSun', serif;
      --sans-en: 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
      --sans-cn: 'Noto Sans TC', '微軟正黑體', 'Microsoft JhengHei', sans-serif;
      --max-width: 1400px;
      --content-width: 900px;
      --transition: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--sans-cn);
      color: var(--dark);
      background: var(--white);
      line-height: 1.7;
      overflow-x: hidden;
    }

    em, i { font-style: normal; }

    a {
      color: inherit;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    img { max-width: 100%; display: block; }

    button {
      font-family: inherit;
      border: none;
      background: none;
      cursor: pointer;
    }

    /* ========== UTILITY BAR (Top) ========== */
    .utility-bar {
      background: var(--near-black);
      color: var(--gray-lighter);
      font-family: var(--sans-en);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 8px 0;
      position: relative;
      z-index: 1000;
    }

    .utility-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .utility-links {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .utility-links a {
      color: var(--gray-light);
      transition: color 0.2s;
    }

    .utility-links a:hover { color: var(--white); }

    .utility-divider {
      width: 1px;
      height: 10px;
      background: var(--gray-dark);
    }

    /* ========== HEADER ========== */
    .site-header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 900;
      transition: box-shadow 0.3s ease;
    }

    .site-header.scrolled {
      box-shadow: 0 2px 20px rgba(0,0,0,0.06);
    }

    .header-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 80px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--off-white);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--accent);
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-logo-placeholder {
      font-family: var(--serif-en);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
    }

    .brand-text-cn {
      font-family: var(--serif-cn);
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--near-black);
      letter-spacing: 0.06em;
    }

    .brand-text-en {
      font-family: var(--sans-en);
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gray);
      margin-top: 2px;
    }

    /* Nav */
    .main-nav {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .main-nav button {
      font-family: var(--sans-cn);
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--gray-dark);
      padding: 28px 20px;
      position: relative;
      letter-spacing: 0.04em;
      transition: color 0.3s ease;
    }

    .main-nav button::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 20px;
      right: 20px;
      height: 2px;
      background: var(--accent);
      transform: scaleX(0);
      transition: transform 0.3s var(--transition);
    }

    .main-nav button:hover { color: var(--near-black); }
    .main-nav button:hover::after,
    .main-nav button.active::after { transform: scaleX(1); }
    .main-nav button.active { color: var(--near-black); font-weight: 500; }

    .nav-en-label {
      display: block;
      font-family: var(--sans-en);
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--gray-light);
      margin-top: 2px;
    }

    .menu-toggle {
      display: none;
      font-family: var(--sans-en);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--dark);
      padding: 10px;
    }

    /* ========== HERO — Full bleed Rockefeller style ========== */
    .hero {
      position: relative;
      height: 92vh;
      min-height: 600px;
      max-height: 1000px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      background: var(--near-black);
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg,
          rgba(10,20,40,0.85) 0%,
          rgba(20,40,60,0.7) 30%,
          rgba(40,60,80,0.5) 60%,
          rgba(60,80,100,0.4) 100%
        ),
        url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><defs><linearGradient id="g" x1="0%25" y1="0%25" x2="100%25" y2="100%25"><stop offset="0%25" style="stop-color:%23061428"/><stop offset="50%25" style="stop-color:%230d2847"/><stop offset="100%25" style="stop-color:%23183a5e"/></linearGradient></defs><rect fill="url(%23g)" width="1200" height="800"/><circle cx="900" cy="200" r="300" fill="rgba(255,255,255,0.02)"/><circle cx="200" cy="600" r="200" fill="rgba(255,255,255,0.015)"/></svg>');
      background-size: cover;
      background-position: center;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 48px 80px;
      width: 100%;
    }

    .hero-eyebrow {
      font-family: var(--sans-en);
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .hero-eyebrow::before {
      content: '';
      width: 40px;
      height: 1px;
      background: var(--gold);
    }

    .hero h1 {
      font-family: var(--serif-cn);
      font-size: clamp(2.2rem, 4.5vw, 3.8rem);
      font-weight: 600;
      color: var(--white);
      line-height: 1.35;
      max-width: 750px;
      margin-bottom: 28px;
      letter-spacing: 0.02em;
    }

    .hero h1 em {
      font-family: var(--serif-en);
      font-style: italic;
      color: var(--gold);
    }

    .hero-desc {
      font-family: var(--sans-cn);
      font-size: 1rem;
      line-height: 1.9;
      color: rgba(255,255,255,0.7);
      max-width: 620px;
      margin-bottom: 40px;
      font-weight: 300;
    }

    .hero-actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: var(--sans-en);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 14px 32px;
      transition: all 0.35s var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-primary {
      background: var(--white);
      color: var(--near-black);
    }

    .btn-primary:hover {
      background: var(--gold);
      color: var(--white);
    }

    .btn-outline {
      border: 1px solid rgba(255,255,255,0.4);
      color: var(--white);
    }

    .btn-outline:hover {
      border-color: var(--white);
      background: rgba(255,255,255,0.08);
    }

    .btn-dark {
      background: var(--near-black);
      color: var(--white);
    }

    .btn-dark:hover {
      background: var(--accent);
    }

    .btn-text {
      color: var(--accent);
      font-family: var(--sans-en);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 8px 0;
      border-bottom: 1px solid transparent;
      transition: all 0.3s ease;
    }

    .btn-text:hover {
      border-bottom-color: var(--accent);
    }

    .hero-stats {
      position: absolute;
      right: 48px;
      bottom: 80px;
      display: flex;
      gap: 0;
      z-index: 2;
    }

    .hero-stat {
      padding: 20px 36px;
      border-left: 1px solid rgba(255,255,255,0.15);
      text-align: center;
    }

    .hero-stat:first-child { border-left: none; }

    .hero-stat-val {
      font-family: var(--serif-en);
      font-size: 2rem;
      font-weight: 400;
      color: var(--white);
      display: block;
    }

    .hero-stat-label {
      font-family: var(--sans-en);
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
      display: block;
    }

    /* ========== SECTIONS ========== */
    .section {
      padding: 100px 0;
    }

    .section-lg { padding: 120px 0; }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 48px;
    }

    .container-narrow {
      max-width: var(--content-width);
      margin: 0 auto;
      padding: 0 48px;
    }

    /* Section headers — Rockefeller style */
    .section-label {
      font-family: var(--sans-en);
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-label::before {
      content: '';
      width: 28px;
      height: 1px;
      background: var(--accent);
    }

    .section-title {
      font-family: var(--serif-cn);
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      font-weight: 600;
      color: var(--near-black);
      line-height: 1.35;
      margin-bottom: 20px;
      letter-spacing: 0.02em;
    }

    .section-title em {
      font-family: var(--serif-en);
      font-style: italic;
      color: var(--accent);
    }

    .section-subtitle {
      font-size: 1rem;
      line-height: 1.85;
      color: var(--gray);
      max-width: 640px;
      font-weight: 300;
    }

    .section-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: end;
      margin-bottom: 64px;
    }

    .section-header-full {
      text-align: center;
      max-width: 700px;
      margin: 0 auto 64px;
    }

    .section-header-full .section-label {
      justify-content: center;
    }

    .section-header-full .section-label::before { display: none; }

    .section-header-full .section-subtitle {
      margin: 0 auto;
    }

    /* ========== PILLAR / RESEARCH CARDS — Grid ========== */
    .pillars-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
    }

    .pillar-card {
      background: var(--white);
      padding: 48px 40px;
      cursor: pointer;
      transition: all 0.4s var(--transition);
      position: relative;
    }

    .pillar-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s var(--transition);
    }

    .pillar-card:hover {
      background: var(--warm-white);
    }

    .pillar-card:hover::before {
      transform: scaleX(1);
    }

    .pillar-num {
      font-family: var(--serif-en);
      font-size: 2.4rem;
      font-weight: 400;
      color: var(--border);
      margin-bottom: 20px;
      transition: color 0.3s;
    }

    .pillar-card:hover .pillar-num { color: var(--accent); }

    .pillar-en {
      font-family: var(--sans-en);
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gray-light);
      margin-bottom: 10px;
    }

    .pillar-card h3 {
      font-family: var(--serif-cn);
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--near-black);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .pillar-card p {
      font-size: 0.88rem;
      line-height: 1.75;
      color: var(--gray);
      font-weight: 300;
    }

    /* ========== ABOUT / MISSION — Split layout ========== */
    .split-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 500px;
    }

    .split-image {
      background:
        linear-gradient(to right, rgba(10,20,40,0.7), rgba(10,20,40,0.3)),
        linear-gradient(135deg, #0d2847, #183a5e);
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px;
    }

    .split-quote {
      font-family: var(--serif-cn);
      font-size: 1.6rem;
      line-height: 1.6;
      color: var(--white);
      font-weight: 400;
      position: relative;
    }

    .split-quote::before {
      content: '"';
      font-family: var(--serif-en);
      font-size: 6rem;
      color: var(--gold);
      position: absolute;
      top: -40px;
      left: -10px;
      line-height: 1;
      opacity: 0.6;
    }

    .split-quote cite {
      display: block;
      margin-top: 24px;
      font-family: var(--sans-en);
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .split-text {
      padding: 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--warm-white);
    }

    .split-text .section-label { margin-bottom: 20px; }

    .split-text h2 {
      font-family: var(--serif-cn);
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--near-black);
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .split-text p {
      font-size: 0.95rem;
      line-height: 1.9;
      color: var(--gray);
      margin-bottom: 16px;
      font-weight: 300;
    }

    .split-text p:last-of-type { margin-bottom: 32px; }

    /* ========== NEWS — Rockefeller editorial style ========== */
    .news-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 0;
    }

    .news-card {
      border: 1px solid var(--border);
      margin: -1px 0 0 -1px;
      padding: 40px;
      cursor: pointer;
      transition: all 0.35s var(--transition);
      display: flex;
      flex-direction: column;
    }

    .news-card:hover {
      background: var(--warm-white);
      z-index: 1;
    }

    .news-card-featured {
      grid-row: span 2;
      background: var(--near-black);
      color: var(--white);
      padding: 48px;
    }

    .news-card-featured:hover {
      background: var(--charcoal);
    }

    .news-date {
      font-family: var(--sans-en);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray-light);
      margin-bottom: 8px;
    }

    .news-card-featured .news-date { color: var(--gold); }

    .news-category {
      font-family: var(--sans-en);
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
    }

    .news-card-featured .news-category { color: var(--gold); }

    .news-card h3 {
      font-family: var(--serif-cn);
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.55;
      margin-bottom: 14px;
      color: var(--near-black);
    }

    .news-card-featured h3 {
      font-size: 1.4rem;
      color: var(--white);
    }

    .news-card p {
      font-size: 0.85rem;
      line-height: 1.75;
      color: var(--gray);
      flex: 1;
      font-weight: 300;
    }

    .news-card-featured p { color: rgba(255,255,255,0.6); }

    .news-read-more {
      font-family: var(--sans-en);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-top: 16px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .news-card-featured .news-read-more { color: var(--gold); }

    /* ========== EXPERTS ========== */
    .experts-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 32px;
    }

    .expert-card {
      text-align: center;
      padding: 40px 24px;
      transition: all 0.35s ease;
    }

    .expert-card:hover {
      background: var(--warm-white);
    }

    .expert-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e8e4dc, #d4cfc5);
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--serif-cn);
      font-size: 1.6rem;
      color: var(--gray);
      border: 3px solid var(--white);
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    .expert-card h4 {
      font-family: var(--serif-cn);
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--near-black);
      margin-bottom: 6px;
    }

    .expert-role {
      font-family: var(--sans-en);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .expert-desc {
      font-size: 0.82rem;
      line-height: 1.7;
      color: var(--gray);
      font-weight: 300;
    }

    /* ========== SERVICES ========== */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0;
    }

    .service-card {
      padding: 56px 48px;
      border: 1px solid var(--border);
      margin: -1px 0 0 -1px;
      transition: all 0.35s ease;
      position: relative;
    }

    .service-card::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--accent);
      transition: width 0.5s var(--transition);
    }

    .service-card:hover::after { width: 100%; }
    .service-card:hover { background: var(--warm-white); }

    .service-num {
      font-family: var(--serif-en);
      font-size: 3rem;
      font-weight: 400;
      color: var(--border);
      margin-bottom: 16px;
      line-height: 1;
    }

    .service-card:hover .service-num { color: var(--accent); }

    .service-card h3 {
      font-family: var(--serif-cn);
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--near-black);
      margin-bottom: 8px;
    }

    .service-en {
      font-family: var(--sans-en);
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gray-light);
      margin-bottom: 16px;
    }

    .service-card p {
      font-size: 0.88rem;
      line-height: 1.8;
      color: var(--gray);
      margin-bottom: 20px;
      font-weight: 300;
    }

    .service-card ul {
      list-style: none;
      padding: 0;
    }

    .service-card ul li {
      font-size: 0.82rem;
      color: var(--gray);
      padding: 6px 0;
      padding-left: 16px;
      position: relative;
      font-weight: 300;
    }

    .service-card ul li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 13px;
